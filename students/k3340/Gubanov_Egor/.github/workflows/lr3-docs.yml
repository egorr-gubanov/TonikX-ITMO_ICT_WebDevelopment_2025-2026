name: Deploy Lr3 MkDocs Documentation

on:
  push:
    branches:
      - gubanov-egorr-lr3
    paths:
      - 'Lr3/ResidentalConnect/docs/**'
      - 'Lr3/ResidentalConnect/mkdocs.yml'
      - 'Lr3/Task1/docs/**'
      - 'Lr3/Task1/mkdocs.yml'
      - 'Lr3/Task2/docs/**'
      - 'Lr3/Task2/mkdocs.yml'
      - '.github/workflows/lr3-docs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies for ResidentalConnect
        run: |
          cd Lr3/ResidentalConnect
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build ResidentalConnect documentation
        run: |
          cd Lr3/ResidentalConnect
          mkdocs build

      - name: Install dependencies for Task1
        run: |
          cd Lr3/Task1
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Task1 documentation
        run: |
          cd Lr3/Task1
          mkdocs build

      - name: Install dependencies for Task2
        run: |
          cd Lr3/Task2
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Task2 documentation
        run: |
          cd Lr3/Task2
          mkdocs build

      - name: Prepare deployment directory
        run: |
          mkdir -p deploy
          # Копируем собранные сайты в единую структуру
          cp -r Lr3/ResidentalConnect/site deploy/ResidentalConnect
          cp -r Lr3/Task1/site deploy/Task1
          cp -r Lr3/Task2/site deploy/Task2

      - name: Deploy all documentation to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          destination_dir: Lr3
          keep_files: true
