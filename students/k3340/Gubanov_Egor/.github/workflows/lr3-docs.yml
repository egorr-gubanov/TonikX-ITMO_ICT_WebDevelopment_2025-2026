name: Deploy Lr3 MkDocs Documentation

on:
  push:
    branches:
      - gubanov-egorr-lr3
    paths:
      - 'Lr3/ResidentalConnect/docs/**'
      - 'Lr3/ResidentalConnect/mkdocs.yml'
      - '.github/workflows/lr3-docs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd Lr3/ResidentalConnect
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build documentation
        run: |
          cd Lr3/ResidentalConnect
          mkdocs build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./Lr3/ResidentalConnect/site
          destination_dir: Lr3/ResidentalConnect
          keep_files: true

